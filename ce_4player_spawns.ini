# Halo: Combat Evolved 4-Player Co-op — Per-Mission Spawn Overrides
# Place this file next to version.dll in MCC/Binaries/Win64/
#
# ONLY THE HOST'S FILE IS USED:
#   On mission launch, the host reads this file and automatically pushes
#   the active mission's spawn rules (including .p0-.p3 overrides) to all
#   connected clients over lockstep. Clients do NOT need matching edits.
#   Backing out to the lobby and restarting a mission hot-reloads this file.
#
# Format:
#   <map>[.p0..p3] = <mode>, [x=<float>], [y=<float>], [z=<float>], [delay=<seconds>], [cutscene=<bool>]
#
# Modes:
#   eject    - Force-exit a locked opening seat (cryochamber/Pelican) after delay and move near an on-foot player
#   separate - Spread overlapping on-foot players apart
#   both     - Enable both eject and separate
#   none     - Disable both
#
# Options:
#   x, y, z  - Offset in meters (mission-wide rules auto-fan players; .p0-.p3 overrides use exact x/y/z)
#   delay    - Seconds a player must be stuck in an opening seat before eject triggers (default: 1.5)
#   cutscene - For 'separate': true = spread players immediately during the opening cutscene (e.g. a30);
#              false (default) = wait until the cutscene ends before separating overlapping players.
#
# Per-player overrides (.p0 = host, .p1/.p2/.p3 = clients) inherit from <map> and use exact x/y/z offsets.
# Example:
#   a10.p0 = eject, x=0.0, y=-1.4, z=0.0, delay=1.5
#   a30.p2 = separate, x=1.2, y=-0.6, z=0.0, cutscene=true

[MissionSpawns]
# 1. The Pillar of Autumn
a10 = eject, x=0.0, y=-0.8, z=0.05, delay=1.5, cutscene=false
# 2. Halo
a30 = separate, x=0.8, y=0.0, z=0.05, cutscene=true
# 3. The Truth and Reconciliation
a50 = eject, x=0.0, y=0.8, z=0.05, delay=1.5, cutscene=false
# 4. The Silent Cartographer
b30 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
# 5. Assault on the Control Room
b40 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
# 6. 343 Guilty Spark
c10 = eject, x=0.0, y=0.8, z=0.05, delay=1.5, cutscene=false
# 7. The Library
c20 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
# 8. Two Betrayals
c40 = separate, x=0.8, y=0.0, z=0.05, cutscene=false
# 9. Keyes
d20 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
# 10. The Maw
d40 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
