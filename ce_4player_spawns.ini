# Halo: Combat Evolved 4-Player Co-op — Per-Mission Spawn Overrides
# Place next to version.dll in MCC/Binaries/Win64/
#
# HOW SYNCING WORKS:
#   Only edit this file on the HOST. On mission launch, the host reloads this file
#   and sends the active mission's rules to all clients automatically.
#   (Backing out to the lobby and restarting a mission hot-reloads your edits.)
#
# PLAYER SLOTS:
#   .p1 = Player 1 (host), .p2 = Player 2, .p3 = Player 3, .p4 = Player 4
#   By default only p3 and p4 have offsets; p1 and p2 stay on the original spawns.
#   You can also set an all-player default for a mission and/or override p1..p4:
#     # a10    = eject, x=0.0, y=-0.8, z=0.05, delay=1.5, cutscene=false   (all-player default example)
#     # a10.p1 = eject, x=0.0, y=-0.8, z=0.05, delay=1.5                   (per-player override example)
#
# SETTINGS:
#   mode     = eject | separate | both | none
#              eject:    force-exit a locked opening seat (cryotube/Pelican) and move near an on-foot player
#              separate: spread overlapping on-foot players apart
#   x, y, z  = offset in meters (.p1-.p4 overrides use exact x/y/z; all-player lines auto-spread players)
#   delay    = seconds stuck in a seat before eject triggers (default: 1.5)
#   cutscene = for 'separate': true = spread during opening cutscene; false = wait until cutscene ends

[MissionSpawns]
# All-player default example:
# a10 = eject, x=0.0, y=-0.8, z=0.05, delay=1.5, cutscene=false

# 1. The Pillar of Autumn
a10.p1 = eject, x=0.0, y=-1.3, z=0.0, delay=1.5, cutscene=false
a10.p3 = eject, x=0.0, y=-0.8, z=0.05, delay=1.5, cutscene=false
a10.p4 = eject, x=0.0, y=-1.2, z=0.05, delay=1.5, cutscene=false

# 2. Halo
a30.p3 = separate, x=0.8, y=0.0, z=0.05, cutscene=true
a30.p4 = separate, x=-0.8, y=0.0, z=0.05, cutscene=true

# 3. The Truth and Reconciliation
a50.p1 = eject, x=0.0, y=0.8, z=0.05, delay=1.5, cutscene=false
a50.p3 = eject, x=0.0, y=0.8, z=0.05, delay=1.5, cutscene=false
a50.p4 = eject, x=0.0, y=1.2, z=0.05, delay=1.5, cutscene=false

# 4. The Silent Cartographer
b30.p3 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
b30.p4 = none, x=-0.8, y=0.0, z=0.05, delay=1.5, cutscene=false

# 5. Assault on the Control Room
b40.p3 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
b40.p4 = none, x=-0.8, y=0.0, z=0.05, delay=1.5, cutscene=false

# 6. 343 Guilty Spark
c10.p3 = eject, x=0.0, y=0.8, z=0.05, delay=1.5, cutscene=false
c10.p4 = eject, x=0.0, y=1.2, z=0.05, delay=1.5, cutscene=false

# 7. The Library
c20.p3 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
c20.p4 = none, x=-0.8, y=0.0, z=0.05, delay=1.5, cutscene=false

# 8. Two Betrayals
c40.p3 = separate, x=0.8, y=0.0, z=0.05, cutscene=false
c40.p4 = separate, x=-0.8, y=0.0, z=0.05, cutscene=false

# 9. Keyes
d20.p3 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
d20.p4 = none, x=-0.8, y=0.0, z=0.05, delay=1.5, cutscene=false

# 10. The Maw
d40.p3 = none, x=0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
d40.p4 = none, x=-0.8, y=0.0, z=0.05, delay=1.5, cutscene=false
